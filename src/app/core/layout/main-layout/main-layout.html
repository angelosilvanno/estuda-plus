<div class="min-h-screen flex bg-(--bg-primary) text-(--text-main) font-sans antialiased">
  
  <aside 
    [class.w-64]="!sidebarRetraida"
    [class.w-20]="sidebarRetraida"
    [class.p-6]="!sidebarRetraida"
    [class.p-4]="sidebarRetraida"
    class="bg-(--bg-surface) border-r border-(--border-color) hidden md:flex flex-col sticky top-0 h-screen z-20 shrink-0 transition-all duration-300 ease-in-out shadow-3xs"
  >
    
    <button 
      (click)="alternarSidebar()"
      class="absolute -right-3.5 top-7 w-7 h-7 rounded-full bg-(--bg-surface) border border-(--border-color) hover:border-blue-500 text-(--text-muted) hover:text-blue-600 flex items-center justify-center cursor-pointer shadow-xs hover:scale-105 transition-all z-30"
      [title]="sidebarRetraida ? 'Expandir Menu' : 'Recolher Menu'"
    >
      <svg *ngIf="!sidebarRetraida" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      <svg *ngIf="sidebarRetraida" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
    </button>

    <div class="flex items-center gap-2.5 mb-8" [class.justify-center]="sidebarRetraida">
      <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-md shadow-xs shrink-0">E+</div>
      <span *ngIf="!sidebarRetraida" class="font-bold text-lg tracking-tight transition-all">Estuda+</span>
    </div>
    
    <nav class="flex-1 space-y-1">
      
      <a 
        [routerLink]="['/dashboard']" 
        routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        [class.justify-center]="sidebarRetraida"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer"
        [title]="sidebarRetraida ? 'Dashboard' : ''"
      >
        <svg class="w-4.5 h-4.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"/></svg>
        <span *ngIf="!sidebarRetraida" class="transition-all">Dashboard</span>
      </a>

      <a 
        [routerLink]="['/cronograma']" 
        routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold"
        [class.justify-center]="sidebarRetraida"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer"
        [title]="sidebarRetraida ? 'Cronograma' : ''"
      >
        <svg class="w-4.5 h-4.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span *ngIf="!sidebarRetraida" class="transition-all">Cronograma</span>
      </a>

      <a 
        [routerLink]="['/disciplinas']" 
        routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold"
        [class.justify-center]="sidebarRetraida"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer"
        [title]="sidebarRetraida ? 'Disciplinas' : ''"
      >
        <svg class="w-4.5 h-4.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span *ngIf="!sidebarRetraida" class="transition-all">Disciplinas</span>
      </a>

      <!-- Metas -->
      <a 
        [routerLink]="['/metas']" 
        routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold"
        [class.justify-center]="sidebarRetraida"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer"
        [title]="sidebarRetraida ? 'Metas' : ''"
      >
        <svg class="w-4.5 h-4.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span *ngIf="!sidebarRetraida" class="transition-all">Metas</span>
      </a>

      <a 
        [routerLink]="['/pomodoro']" 
        routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold"
        [class.justify-center]="sidebarRetraida"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer"
        [title]="sidebarRetraida ? 'Pomodoro' : ''"
      >
        <svg class="w-4.5 h-4.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span *ngIf="!sidebarRetraida" class="transition-all">Pomodoro</span>
      </a>
    </nav>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    
    <header class="h-16 bg-(--bg-surface) border-b border-(--border-color) flex items-center justify-between px-6 sticky top-0 z-10 shrink-0 shadow-3xs">
      
      <div class="flex items-center gap-4 w-96">
        <button 
          (click)="alternarMenu()"
          class="p-2 text-(--text-muted) hover:bg-(--bg-primary) rounded-xl md:hidden cursor-pointer"
          aria-label="Menu Principal"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div class="relative w-full hidden sm:block">
          <input 
            type="text" 
            placeholder="Buscar no Estuda+..." 
            class="w-full bg-(--bg-primary) border border-(--border-color) rounded-xl pl-9 pr-4 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          >
          <svg class="w-4 h-4 text-(--text-muted) absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        
        <button class="p-2.5 text-(--text-muted) hover:bg-(--bg-primary) rounded-xl relative cursor-pointer" aria-label="Notificações">
          <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
          <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        </button>

        <span class="w-px h-8 bg-(--border-color) mx-1 hidden sm:block"></span>

        <div [routerLink]="['/perfil']" class="flex items-center gap-2.5 cursor-pointer pl-1 group">
          <img [src]="avatarUrl" alt="Foto de Perfil" class="w-8 h-8 rounded-full object-cover border border-(--border-color) group-hover:border-blue-500 transition-all">
          <div class="hidden sm:block text-left">
            <p class="text-xs font-bold leading-tight group-hover:text-blue-500 transition-all">{{ estudanteNome }}</p>
            <p class="text-[10px] text-(--text-muted)">{{ estudanteCurso }}</p>
          </div>
        </div>

      </div>
    </header>

    <div 
      *ngIf="menuAberto"
      class="fixed inset-0 bg-black/40 z-30 md:hidden"
      (click)="alternarMenu()"
    >
      <div 
        class="w-64 bg-(--bg-surface) h-full p-6 flex flex-col shadow-xs"
        (click)="$event.stopPropagation()"
      >
        <div class="flex items-center justify-between mb-8">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-md shadow-xs">E+</div>
            <span class="font-bold text-lg tracking-tight">Estuda+</span>
          </div>
          <button (click)="alternarMenu()" class="p-1 text-(--text-muted) hover:bg-(--bg-primary) rounded-lg cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <nav class="space-y-1" (click)="alternarMenu()">
          <a [routerLink]="['/dashboard']" routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer">Dashboard</a>
          <a [routerLink]="['/cronograma']" routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer">Cronograma</a>
          <a [routerLink]="['/disciplinas']" routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer">Disciplinas</a>
          <a [routerLink]="['/metas']" routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer">Metas</a>
          <a [routerLink]="['/pomodoro']" routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-300 font-bold" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-(--text-muted) hover:bg-(--bg-primary) hover:text-(--text-main) transition-all cursor-pointer">Pomodoro</a>
        </nav>
      </div>
    </div>

    <main class="flex-1 p-6 sm:p-8 overflow-y-auto bg-(--bg-primary)">
      <router-outlet />
    </main>

  </div>
</div>
